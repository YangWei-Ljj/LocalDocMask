[build-system]
requires = ["setuptools==84.2.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "localdocmask"
version = "0.1.0"
description = "LocalDocMask - 本地文件脱敏工作台（文档敏感信息检测与脱敏，全程本地运行）"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LocalDocMask Team" }]
keywords = ["pdf", "docx", "xlsx", "pii", "redaction", "ocr", "pyside6"]

dependencies = [
    "PySide6==6.12.0",
    "PyMuPDF==2.0",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "Pillow==13.0.0",
    "opencv-python==5.0.0.93",
    "rapidocr-onnxruntime==1.4.4",
    "onnxruntime==1.31.0",
    "requests==2.34.2",
    "pyyaml==6.0.3",
    "numpy==2.4.6",
    "lxml==6.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "PyInstaller==6.22.3",
]

[project.scripts]
localdocmask = "localdocmask.presentation.gui.main_window:run"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["localdocmask*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
